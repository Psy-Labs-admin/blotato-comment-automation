name: Verify interview project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Run the clean installation and acceptance suite
        run: npm run verify
      - name: Validate external monitoring and alert rules
        run: sh deploy/monitoring/check.sh
      - name: Exercise the default Docker quickstart twice
        run: node scripts/workspace-smoke.cjs --docker-workspace
      - name: Build deployable image
        run: docker build --tag blotato-workspace:checks .
      - name: Verify runtime assets
        run: docker run --rm blotato-workspace:checks node -e "require('./dist/api/server'); require('node:fs').accessSync('dist/ui/index.html')"
      - name: Upload coverage and acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          retention-days: 30
          path: |
            coverage/
            !coverage/server/
            reports/tests.xml
            reports/browser.xml
            reports/acceptance/
