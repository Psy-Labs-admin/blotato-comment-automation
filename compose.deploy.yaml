name: blotato
services:
  app:
    build: .
    env_file: ${BLOTATO_ENV_FILE:?Choose the private service environment file}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CONSOLE_ORIGIN: https://${PUBLIC_HOST:?Set the DNS name for this service}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  certificates:
  caddy_config:
