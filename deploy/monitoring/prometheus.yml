global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: comment-automation
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    file_sd_configs:
      - files: [/etc/prometheus/targets.yml]
        refresh_interval: 15s
alerting:
  alertmanagers:
    - file_sd_configs:
        - files: [/etc/prometheus/alertmanagers.yml]
          refresh_interval: 15s
